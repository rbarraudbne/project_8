{% extends 'base.html' %}
{% block title %}Connexion – LITRevu{% endblock %}
{% block content %}
  <h1>Se connecter</h1>
  <form method="post" novalidate>
    {% csrf_token %}
    {% include 'authentication/_form_fields.html' %}
    <button type="submit">Se connecter</button>
  </form>
  <p>Pas encore de compte ? <a href="{% url 'signup' %}">Créer un compte</a></p>
{% endblock %}
